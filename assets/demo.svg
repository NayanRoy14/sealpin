<svg xmlns="http://www.w3.org/2000/svg" width="792" height="862" viewBox="0 0 792 862" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="14">
  <rect x="0" y="0" width="792" height="862" rx="10" fill="#1e1e1e"/>
  <rect x="0" y="0" width="792" height="34" rx="10" fill="#2d2d2d"/>
  <rect x="0" y="20" width="792" height="14" fill="#2d2d2d"/>
  <circle cx="20" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="40" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="60" cy="17" r="6" fill="#27c93f"/>
  <text x="396" y="22" text-anchor="middle" fill="#8a8a8a" font-size="12">sealpin scan</text>
<text x="18" y="67" xml:space="preserve"><tspan fill="#d4d4d4" font-weight="bold">sealpin scan</tspan></text>
<text x="18" y="88" xml:space="preserve"><tspan fill="#d4d4d4" opacity="0.65">2 server(s) scanned · 2 with tool manifest · 3 finding(s)</tspan></text>
<text x="18" y="109" xml:space="preserve"></text>
<text x="18" y="130" xml:space="preserve"><tspan fill="#f14c4c" font-weight="bold">CRITICAL</tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#d4d4d4" font-weight="bold">MCP-P001</tspan><tspan fill="#d4d4d4">  </tspan><tspan fill="#56b6c2">github › create_issue</tspan></text>
<text x="18" y="151" xml:space="preserve"><tspan fill="#d4d4d4">  Tool "create_issue" description contains instructions directed at the model, not documen</tspan></text>
<text x="18" y="172" xml:space="preserve"><tspan fill="#d4d4d4">tation for a human.</tspan></text>
<text x="18" y="193" xml:space="preserve"><tspan fill="#d4d4d4">  </tspan><tspan fill="#7f848e">evidence:</tspan><tspan fill="#d4d4d4">    [secret] .aws/credentials  ·  [secret] credentials  ·  [exfil] include its </tspan></text>
<text x="18" y="214" xml:space="preserve"><tspan fill="#d4d4d4">contents in the response  ·  [imperative] Before calling</tspan></text>
<text x="18" y="235" xml:space="preserve"><tspan fill="#d4d4d4">  </tspan><tspan fill="#7f848e">why:</tspan><tspan fill="#d4d4d4">         The description field is injected verbatim into the model context as truste</tspan></text>
<text x="18" y="256" xml:space="preserve"><tspan fill="#d4d4d4">d tool documentation. Text that instructs the model to read credentials, exfiltrate data, </tspan></text>
<text x="18" y="277" xml:space="preserve"><tspan fill="#d4d4d4">or override prior instructions is a tool-poisoning payload (OWASP LLM01): the user never s</tspan></text>
<text x="18" y="298" xml:space="preserve"><tspan fill="#d4d4d4">ees the description, but the model always does.</tspan></text>
<text x="18" y="319" xml:space="preserve"><tspan fill="#d4d4d4">  </tspan><tspan fill="#7f848e">remediation:</tspan><tspan fill="#d4d4d4"> Do not install or update this server until the maintainer removes the model</tspan></text>
<text x="18" y="340" xml:space="preserve"><tspan fill="#d4d4d4">-directed instructions. If you trust the source, open an issue quoting the flagged text an</tspan></text>
<text x="18" y="361" xml:space="preserve"><tspan fill="#d4d4d4">d pin the last known-good manifest with `sealpin lock`.</tspan></text>
<text x="18" y="382" xml:space="preserve"></text>
<text x="18" y="403" xml:space="preserve"><tspan fill="#f14c4c">HIGH    </tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#d4d4d4" font-weight="bold">MCP-C001</tspan><tspan fill="#d4d4d4">  </tspan><tspan fill="#56b6c2">filesystem</tspan></text>
<text x="18" y="424" xml:space="preserve"><tspan fill="#d4d4d4">  Filesystem server "filesystem" is rooted at filesystem root ("/").</tspan></text>
<text x="18" y="445" xml:space="preserve"><tspan fill="#d4d4d4">  </tspan><tspan fill="#7f848e">evidence:</tspan><tspan fill="#d4d4d4">    npx -y @modelcontextprotocol/server-filesystem /</tspan></text>
<text x="18" y="466" xml:space="preserve"><tspan fill="#d4d4d4">  </tspan><tspan fill="#7f848e">why:</tspan><tspan fill="#d4d4d4">         A filesystem server grants the model read/write access to every declared ro</tspan></text>
<text x="18" y="487" xml:space="preserve"><tspan fill="#d4d4d4">ot. Rooting it at the filesystem or home directory means any prompt injection that reaches</tspan></text>
<text x="18" y="508" xml:space="preserve"><tspan fill="#d4d4d4"> this agent can read secrets (SSH keys, .env, credentials) or overwrite arbitrary files. D</tspan></text>
<text x="18" y="529" xml:space="preserve"><tspan fill="#d4d4d4">eclared scope should match the task, not the whole disk.</tspan></text>
<text x="18" y="550" xml:space="preserve"><tspan fill="#d4d4d4">  </tspan><tspan fill="#7f848e">remediation:</tspan><tspan fill="#d4d4d4"> Restrict the server to the narrowest directory it needs (e.g. a single proj</tspan></text>
<text x="18" y="571" xml:space="preserve"><tspan fill="#d4d4d4">ect folder) instead of a drive/home/filesystem root.</tspan></text>
<text x="18" y="592" xml:space="preserve"></text>
<text x="18" y="613" xml:space="preserve"><tspan fill="#e5c07b">MEDIUM  </tspan><tspan fill="#d4d4d4"> </tspan><tspan fill="#d4d4d4" font-weight="bold">MCP-C003</tspan><tspan fill="#d4d4d4">  </tspan><tspan fill="#56b6c2">github</tspan></text>
<text x="18" y="634" xml:space="preserve"><tspan fill="#d4d4d4">  Environment variable "GITHUB_TOKEN" on server "github" holds a plaintext GitHub token.</tspan></text>
<text x="18" y="655" xml:space="preserve"><tspan fill="#d4d4d4">  </tspan><tspan fill="#7f848e">evidence:</tspan><tspan fill="#d4d4d4">    GITHUB_TOKEN=ghp…aa (40 chars)</tspan></text>
<text x="18" y="676" xml:space="preserve"><tspan fill="#d4d4d4">  </tspan><tspan fill="#7f848e">why:</tspan><tspan fill="#d4d4d4">         MCP config files are frequently world-readable, synced to the cloud, and (f</tspan></text>
<text x="18" y="697" xml:space="preserve"><tspan fill="#d4d4d4">or project-level .mcp.json) committed to source control. Storing a live credential in plai</tspan></text>
<text x="18" y="718" xml:space="preserve"><tspan fill="#d4d4d4">ntext there means the secret is exposed to anyone who can read the file, and it is handed </tspan></text>
<text x="18" y="739" xml:space="preserve"><tspan fill="#d4d4d4">to the server process wholesale.</tspan></text>
<text x="18" y="760" xml:space="preserve"><tspan fill="#d4d4d4">  </tspan><tspan fill="#7f848e">remediation:</tspan><tspan fill="#d4d4d4"> Move the secret to a secrets manager or an untracked local env file, and re</tspan></text>
<text x="18" y="781" xml:space="preserve"><tspan fill="#d4d4d4">ference it indirectly. Rotate the credential if this config has ever been shared or commit</tspan></text>
<text x="18" y="802" xml:space="preserve"><tspan fill="#d4d4d4">ted.</tspan></text>
<text x="18" y="823" xml:space="preserve"></text>
<text x="18" y="844" xml:space="preserve"><tspan fill="#d4d4d4" font-weight="bold">Summary: </tspan><tspan fill="#f14c4c" font-weight="bold">1 critical</tspan><tspan fill="#7f848e"> · </tspan><tspan fill="#f14c4c">1 high</tspan><tspan fill="#7f848e"> · </tspan><tspan fill="#e5c07b">1 medium</tspan></text>
</svg>
