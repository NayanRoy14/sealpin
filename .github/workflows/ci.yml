name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Install bubblewrap so the probe sandbox integration tests actually run
      # on real Linux (they auto-skip where no sandbox is available). macOS has
      # sandbox-exec preinstalled; Windows runs process-only and skips them.
      - name: Install bubblewrap (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
